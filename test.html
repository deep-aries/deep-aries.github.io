<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Page</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .tab-button { padding: 10px 20px; margin: 5px; background: #007bff; color: white; border: none; cursor: pointer; }
        .tab-button.active { background: #0056b3; }
        .tab-content { display: none; padding: 20px; border: 1px solid #ccc; margin-top: 10px; }
        .tab-content.active { display: block; }
    </style>
</head>
<body>
    <h1>🧪 Test Page</h1>
    
    <nav class="tabs">
        <button class="tab-button active" onclick="showTab('tab1')">Tab 1</button>
        <button class="tab-button" onclick="showTab('tab2')">Tab 2</button>
        <button class="tab-button" onclick="showTab('tab3')">Tab 3</button>
    </nav>
    
    <div class="tab-content active" id="tab1">
        <h2>Tab 1 Content</h2>
        <p>This is tab 1 content. If you can see this, basic functionality works!</p>
        <div id="test-chart" style="width: 100%; height: 300px;"></div>
    </div>
    
    <div class="tab-content" id="tab2">
        <h2>Tab 2 Content</h2>
        <p>This is tab 2 content.</p>
    </div>
    
    <div class="tab-content" id="tab3">
        <h2>Tab 3 Content</h2>
        <p>This is tab 3 content.</p>
    </div>
    
    <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
    <script>
        function showTab(tabName) {
            console.log('Switching to:', tabName);
            
            // Hide all tabs
            document.querySelectorAll('.tab-content').forEach(tab => {
                tab.classList.remove('active');
            });
            
            // Remove active from all buttons
            document.querySelectorAll('.tab-button').forEach(btn => {
                btn.classList.remove('active');
            });
            
            // Show selected tab
            document.getElementById(tabName).classList.add('active');
            
            // Add active to clicked button
            event.target.classList.add('active');
        }
        
        // Test chart
        document.addEventListener('DOMContentLoaded', function() {
            console.log('Page loaded, creating test chart...');
            
            const trace = {
                x: [1, 2, 3, 4, 5],
                y: [1, 4, 2, 3, 5],
                type: 'scatter',
                mode: 'lines+markers',
                name: 'Test Data'
            };
            
            const layout = {
                title: 'Test Chart',
                xaxis: { title: 'X' },
                yaxis: { title: 'Y' }
            };
            
            Plotly.newPlot('test-chart', [trace], layout);
            console.log('Test chart created!');
        });
    </script>
</body>
</html>
