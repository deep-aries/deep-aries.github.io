# GitHub Pages Academic Configuration
title: "DeepAries - Adaptive Portfolio Rebalancing Demo"
description: "Interactive demo of DeepAries: Adaptive Rebalancing Interval Selection for Enhanced Portfolio Selection (CIKM 2025)"
baseurl: ""
url: "https://deep-aries.github.io"

# GitHub Pages 설정
plugins:
  - jekyll-sitemap
  - jekyll-feed

# 빌드 설정
exclude:
  - README.md
  - .gitignore
  - Gemfile
  - Gemfile.lock

# 성능 최적화
compress_html:
  clippings: all
  comments: all
  endings: all
  startings: [html, head, body]
